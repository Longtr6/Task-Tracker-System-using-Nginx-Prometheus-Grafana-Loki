name: task_tracker_project

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: task_tracker_postgres
    # --- [HARDENING]: Đổi từ 'always' thành 'unless-stopped' ---
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # --- [HARDENING]: Gỡ bỏ port 5432 ra ngoài Internet. Chỉ cho phép các container trong mạng nội bộ kết nối ---
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_network
    # --- [HARDENING]: Thêm giới hạn tài nguyên (Chống DoS cạn kiệt RAM/CPU) ---
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Công cụ quản lý Database (pgAdmin) - Đáp ứng Tiêu chí 2
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: task_tracker_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - task_network

  # 3. Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_tracker_backend
    restart: unless-stopped
    # --- [HARDENING]: Không mở port trực tiếp 8001 ra ngoài nếu đã đi qua Nginx Reverse Proxy ---
    # ports:
    #   - "8001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - task_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # 4. Nginx Reverse Proxy & Frontend
  nginx:
    image: nginx:alpine
    container_name: task_tracker_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - task_network

  # ==========================================
  # CÁC SERVICE GIÁM SÁT (COMMIT 2)
  # ==========================================

  # 5. Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: task_tracker_prometheus
    restart: unless-stopped
    # --- [HARDENING]: Khóa port nội bộ Prometheus, chỉ truy cập thông qua Nginx Reverse Proxy ---
    # ports:
    #   - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - task_network

  # 6. Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: task_tracker_grafana
    restart: unless-stopped
    # --- [HARDENING]: Khóa port trực tiếp 3000, bắt buộc qua Nginx ---
    # ports:
    #   - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - task_network

  # 7. cAdvisor (Giám sát tài nguyên container Docker)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: task_tracker_cadvisor
    restart: unless-stopped
    # --- [HARDENING]: Gỡ bỏ port 8080 public ra ngoài ---
    # ports:
    #   - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - task_network

  # 8. PostgreSQL Exporter (Giám sát database)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: task_tracker_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    # --- [HARDENING]: Đóng port 9187 nội bộ ---
    # ports:
    #   - "9187:9187"
    depends_on:
      - db
    networks:
      - task_network

# 9. Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: task_tracker_nginx_exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://task_tracker_nginx/stub_status'
    depends_on:
      - nginx
    networks:
      - task_network

  # ==========================================
  # CÁC SERVICE LOGGING (COMMIT 3)
  # ==========================================

  # 10. Loki (Lưu trữ log tập trung)
  loki:
    image: grafana/loki:latest
    container_name: task_tracker_loki
    restart: unless-stopped
    # --- [HARDENING]: Đóng port 3100 ra ngoài ---
    # ports:
    #   - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./logging/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - task_network

  # 11. Promtail (Thu thập log container đẩy về Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: task_tracker_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./logging/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - task_network

volumes:
  postgres_data:
    name: task_tracker_postgres_data
  prometheus_data:
    name: task_tracker_prometheus_data
  grafana_data:
    name: task_tracker_grafana_data
  loki_data:
    name: task_tracker_loki_data

networks:
  task_network:
    driver: bridge