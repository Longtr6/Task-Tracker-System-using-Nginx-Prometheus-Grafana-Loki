# 1. Chuyển hướng toàn bộ traffic HTTP (80) sang HTTPS (443)
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# 2. Block chính xử lý HTTPS an toàn
server {
    listen 443 ssl;
    server_name _;

    # Đường dẫn tới chứng chỉ SSL tự ký
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # Cấu hình giao thức TLS an toàn (Chỉ cho phép TLS 1.2 và TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Giới hạn dung lượng tải lên tối đa chống tấn công DoS
    client_max_body_size 10M;

    # --- SECURITY HEADERS ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Chuyển tiếp API đến FastAPI
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint nội bộ dành cho Nginx Prometheus Exporter cào dữ liệu giám sát
    location /stub_status {
        stub_status on;
        access_log off;
        # Chỉ cho phép các container trong hệ thống nội bộ truy cập
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Hỗ trợ React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}